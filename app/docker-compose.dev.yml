# =============================================================================
# docker-compose.dev.yml - DEVELOPMENT CONFIGURATION
# 
# Usage: docker-compose -f docker-compose.dev.yml up
# 
# Optimized for development with:
# - Development Dockerfile (includes dev tools)
# - Volume mounts for hot-reload
# - Testing dependencies
# - Development tools (black, flake8, mypy, etc.)
# =============================================================================

services:
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile.dev
    image: basmati-backend-api:dev
    container_name: basmati-backend-api-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount source code for hot-reload
      - ./backend-api:/app
      # Prevent overwriting node_modules if needed in future
      - /app/__pycache__
    networks:
      - basmati-network
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - API_RELOAD=true
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

networks:
  basmati-network:
    driver: bridge
