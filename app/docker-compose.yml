services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_GATEWAY_URL=${VITE_API_GATEWAY_URL}
      - VITE_DEV_USER_1_EMAIL=${DEV_USER_1_EMAIL:-amcgil@uma.es}
      - VITE_DEV_USER_2_EMAIL=${DEV_USER_2_EMAIL:-rubenoliva@uma.es}
    depends_on:
      - api-gateway
    networks:
      - basmati-network

  # API Gateway
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: basmati-api-gateway
    ports:
      - "8000:8000"
    environment:
      - SERVICE_PORT=8000
      - USER_SERVICE_URL=http://user-service:8001
      - CALENDAR_SERVICE_URL=http://calendar-service:8002
      - EVENT_SERVICE_URL=http://event-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8004
      - INTEGRATION_SERVICE_URL=http://integration-service:8006
      - AUTH_SERVICE_URL=http://auth-service:8005
    depends_on:
      - user-service
      - calendar-service
      - event-service
      - notification-service
      - integration-service
      - auth-service
    networks:
      - basmati-network

  # User Service
  user-service:
    build:
      context: ./backend
      dockerfile: user_service/Dockerfile
    container_name: basmati-user-service
    ports:
      - "8001:8001"
    environment:
      - MONGO_URI=${MONGO_URI}
      - SERVICE_PORT=8001
      - DATABASE_NAME=basmati
      - DEV_USER_1_EMAIL=${DEV_USER_1_EMAIL:-amcgil@uma.es}
      - DEV_USER_2_EMAIL=${DEV_USER_2_EMAIL:-rubenoliva@uma.es}
      - DEV_USER_3_EMAIL=${DEV_USER_3_EMAIL:-daily_digest_test@example.com}
    networks:
      - basmati-network

  # Calendar Service
  calendar-service:
    build:
      context: ./backend
      dockerfile: calendar_service/Dockerfile
    container_name: basmati-calendar-service
    ports:
      - "8002:8002"
    environment:
      - MONGO_URI=${MONGO_URI}
      - SERVICE_PORT=8002
      - DATABASE_NAME=basmati
      - USER_SERVICE_URL=http://user-service:8001
      - EVENT_SERVICE_URL=http://event-service:8003
    depends_on:
      - user-service
    networks:
      - basmati-network

  # Event Service
  event-service:
    build:
      context: ./backend
      dockerfile: event_service/Dockerfile
    container_name: basmati-event-service
    ports:
      - "8003:8003"
    environment:
      - MONGO_URI=${MONGO_URI}
      - SERVICE_PORT=8003
      - DATABASE_NAME=basmati
      - NOTIFICATION_SERVICE_URL=http://notification-service:8004
      - CALENDAR_SERVICE_URL=http://calendar-service:8002
      - USER_SERVICE_URL=http://user-service:8001
      - INTEGRATION_SERVICE_URL=http://integration-service:8006
    depends_on:
      - calendar-service
      - notification-service
      - user-service
    networks:
      - basmati-network

  # Notification Service
  notification-service:
    build:
      context: ./backend
      dockerfile: notification_service/Dockerfile
    container_name: basmati-notification-service
    ports:
      - "8004:8004"
    environment:
      - MONGO_URI=${MONGO_URI}
      - SERVICE_PORT=8004
      - DATABASE_NAME=basmati
      - USER_SERVICE_URL=http://user-service:8001
      - EMAIL_SERVICE_API_KEY=${EMAIL_SERVICE_API_KEY:-}
    depends_on:
      - user-service
    networks:
      - basmati-network

  # Integration Service
  integration-service:
    build:
      context: ./backend
      dockerfile: integration_service/Dockerfile
    container_name: basmati-integration-service
    ports:
      - "8006:8006"
    environment:
      - MONGO_URI=${MONGO_URI}
      - SERVICE_PORT=8006
      - DATABASE_NAME=basmati
      - CALENDAR_SERVICE_URL=http://calendar-service:8002
      - EVENT_SERVICE_URL=http://event-service:8003
      - USER_SERVICE_URL=http://user-service:8001
      - NOTIFICATION_SERVICE_URL=http://notification-service:8004
      - GOOGLE_CALENDAR_API_KEY=${GOOGLE_CALENDAR_API_KEY:-}
      - TEAMUP_API_KEY=${TEAMUP_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDER_EMAIL=${SENDER_EMAIL:-amcgil@uma.es}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      - calendar-service
      - event-service
      - user-service
      - notification-service
    networks:
      - basmati-network

  # Auth Service - OAuth y autenticación
  auth-service:
    build:
      context: ./backend
      dockerfile: auth_service/Dockerfile
    container_name: basmati-auth-service
    ports:
      - "8005:8005"
    environment:
      - MONGO_URI=${MONGO_URI}
      - SERVICE_PORT=8005
      - DATABASE_NAME=basmati
      - USER_SERVICE_URL=http://user-service:8001
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/v1/auth/google/callback}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-basmati-secret-key-dev}
      - JWT_EXPIRE_MINUTES=10080
      # JWT_EXPIRE_MINUTES is in minutes; 7 days = 60 * 24 * 7 = 10080
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      - user-service
    networks:
      - basmati-network

networks:
  basmati-network:
    driver: bridge

