# =============================================================================
# docker-compose.yml - PRODUCTION CONFIGURATION
# 
# Usage: docker-compose up -d
# 
# Optimized for production deployment with:
# - Production Dockerfile (multi-stage build)
# - No volumes (baked code)
# - Health checks enabled
# - Restart policies
# =============================================================================

services:
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    image: basmati-backend-api:latest
    container_name: basmati-backend-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - basmati-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  basmati-network:
    driver: bridge
